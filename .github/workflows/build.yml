---
name: Build
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - release/*
  pull_request:
jobs:
  yamllint:
    uses: dropwizard/workflows/.github/workflows/yamllint.yml@03157308cef2eae58551c4ef12ae4f901c0134c1 # main
  build:
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    uses: dropwizard/workflows/.github/workflows/maven.yml@03157308cef2eae58551c4ef12ae4f901c0134c1 # main
    secrets: inherit
    with:
      java-version: ${{ matrix.java-version }}
